    <!-- Google tag (gtag.js) loader — the one canonical GA4 install for this site.
         Static so Google Tag Diagnostics can detect it in the served HTML. ID comes
         from VITE_GA_MEASUREMENT_ID via Vite's HTML env replacement.

         The `js`/`config` commands deliberately do NOT live here. vercel.json sets
         script-src to 'self' https://www.googletagmanager.com with no
         'unsafe-inline' and no nonce, so an inline script element is blocked
         outright and gtag.js would never receive a config — it then sends nothing
         at all. src/utils/analytics.js issues them from bundled JS, which 'self'
         permits. Do not add an inline snippet here, and never add a second loader. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
